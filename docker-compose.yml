version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mistigolpo_db
    environment:
      POSTGRES_DB: mistigolpo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mistigolpo_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/mistigolpo_db
      JWT_SECRET_KEY: mistigolpo_secret_key_change_me
    ports:
      - "8000:8000"
    depends_on:
      - db
